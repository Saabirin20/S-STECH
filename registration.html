</head>
<body>

<header>
  <nav class="navbar">
    <div class="nav-logo">S&S TECH</div>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="hamburger"><i class="fas fa-bars"></i></label>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>

  </nav>

<section class="register-section">
  <h2>IT Training & Recruitment Registration</h2>
  <form class="register-form">
    <div class="row">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
    </div>
    <div class="row">
      <input type="tel" placeholder="Phone Number" required>
      <input type="text" placeholder="Location (City/Country)" required>
    </div>
    <div class="row">
      <select required>
        <option value="">Select Program</option>
        <option>Web Development</option>
        <option>Mobile App Development</option>
        <option>Cybersecurity</option>
        <option>Data Science</option>
        <option>Cloud Computing</option>
        <option>Graphic Design</option>
      </select>
      <select required>
        <option value="">Purpose</option>
        <option>Training</option>
        <option>Job Application</option>
        <option>Internship</option>
      </select>
    </div>
    <textarea placeholder="Why do you want to join?" rows="5"></textarea>
    <button type="submit">Submit Application</button>
  </form>
</section>

<footer>
  <h3>S&S TECH COMPANY</h3>
  <p>Building the Future Through Technology</p>
  <p>© 2026 All Rights Reserved</p>
</footer>
